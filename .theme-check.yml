# Storefront theme, not a theme app extension. Using :theme_app_extension here
# wrongly fires AppBlockValidTags on {% section %} / {% sections %} in layouts.
extends: :default

ImgLazyLoading:
  enabled: true
AssetSizeCSS:
  enabled: true
  threshold_in_bytes: 100000
AssetSizeJavaScript:
  enabled: true
  threshold_in_bytes: 40000
UndefinedObject:
  enabled: true
DeprecatedFilter:
  enabled: true
