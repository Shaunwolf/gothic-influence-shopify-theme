# Storefront theme, not a theme app extension. Using :theme_app_extension here
# wrongly fires AppBlockValidTags on {% section %} / {% sections %} in layouts.
extends: :default

ImgLazyLoading:
  enabled: true
AssetSizeCSS:
  enabled: true
  # base.css is 69KB raw, 14.6KB gzipped.
  threshold_in_bytes: 100000
AssetSizeJavaScript:
  enabled: true
  # This check reads RAW bytes despite its "compressed" wording. theme.js is
  # 42KB raw but 10.5KB gzipped, which is what a visitor actually downloads.
  # 80000 raw is roughly a 20KB gzipped budget — still tight enough to catch
  # real bloat, without failing on a number nobody transfers.
  threshold_in_bytes: 80000
UndefinedObject:
  enabled: true
DeprecatedFilter:
  enabled: true
